<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LiveLaku - Flood to Priority Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>LiveLaku</h1>
    <p class="sub">One input → one Priority Card (Window 10s) - mock works offline.</p>
  </header>

  <main>
    <section class="card">
      <label>Live Source
        <select id="source">
          <option value="mock" selected>Mock (demo flood - no keys)</option>
          <option value="shopee">Shopee - session_id</option>
          <option value="tiktok">TikTok - @handle</option>
        </select>
      </label>
      <label id="liveInputLabel">Live handle / session_id
        <input id="liveInput" placeholder="mock: leave empty, shopee: 6236215, tiktok: @tokoku" />
      </label>
      <div class="row">
        <button id="playBtn">▶ Play Mock Flood (10s Window)</button>
        <button id="injectBtn">+ Inject “kak mahal amat”</button>
        <button id="sendBtn">POST /analyze now</button>
      </div>
      <p class="hint">FE batches one Window locally, then <code>POST /analyze {comments: [...]}</code>. BE is sync-only, see <code>contracts/openapi.yaml</code>.</p>
    </section>

    <section class="card">
      <h2>Window buffer <span id="bufCount">0</span></h2>
      <ul id="buffer" class="buffer"></ul>
      <div id="clusters" class="clusters"></div>
    </section>

    <section id="priorityCard" class="card priority hidden">
      <h2>Priority Card</h2>
      <div id="cardTop"></div>
      <p id="cardReply" class="reply"></p>
      <p id="cardWhy" class="why"></p>
      <p class="meta"><span id="cardUrgency"></span> · <span id="cardSource"></span></p>
    </section>
  </main>

  <footer><code>contracts/openapi.yaml</code> is the contract - see <code>AGENTS.md</code></footer>
  <script src="app.js"></script>
</body>
</html>
